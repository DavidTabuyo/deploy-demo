<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kanban Workspace</title>
  <style>
    :root{
      --bg:#050505;
      --ink:#f5f5f3;
      --muted:#858581;
      --muted-2:#5b5b57;
      --line:#1a1a18;
      --line-strong:#252522;
      --accent:#17c7d9;
      --accent-soft:#0b1a1c;

      --low:#2ea8ff;
      --low-bg:#09151d;
      --medium:#ffbd3f;
      --medium-bg:#1b1507;
      --high:#ff526f;
      --high-bg:#1d0a0f;

      --sidebar-collapsed:44px;
      --sidebar-open:236px;
      --header-h:54px;
      --radius:12px;
      --ease:cubic-bezier(.22,.72,.22,1);
    }

    *{box-sizing:border-box}

    html,body{
      width:100%;
      min-height:100%;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }

    button,input,textarea{font:inherit}
    button{border:0;outline:0}

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible{
      box-shadow:0 0 0 2px rgba(23,199,217,.22);
    }

    .icon{
      width:17px;
      height:17px;
      display:block;
      flex:0 0 auto;
      fill:none;
      stroke:currentColor;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .workspace{
      min-height:100vh;
      display:grid;
      grid-template-columns:var(--sidebar-collapsed) minmax(0,1fr);
      transition:grid-template-columns .24s var(--ease);
    }

    .workspace.sidebar-open{
      grid-template-columns:var(--sidebar-open) minmax(0,1fr);
    }

    /* ---------- Sidebar ---------- */

    .sidebar{
      min-height:100vh;
      background:#070707;
      border-right:1px solid var(--line);
      overflow:hidden;
      position:relative;
      z-index:20;
      transition:width .24s var(--ease);
    }

    .sidebar-inner{
      width:var(--sidebar-open);
      min-height:100vh;
      display:flex;
      flex-direction:column;
      position:relative;
    }

    .sidebar-top{
      width:var(--sidebar-collapsed);
      height:var(--header-h);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0;
      flex:0 0 auto;
    }

    .sidebar-toggle{
      width:34px;
      height:34px;
      padding:0;
      background:transparent;
      color:#505854;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:color .15s ease,transform .18s var(--ease);
    }

    .sidebar-toggle:hover{color:var(--accent)}
    .sidebar-toggle .icon{
      width:16px;
      height:16px;
    }


    .sidebar-rail-actions{
      position:absolute;
      top:var(--header-h);
      left:0;
      width:var(--sidebar-collapsed);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:9px;
      padding-top:6px;
      opacity:1;
      pointer-events:auto;
      transition:opacity .12s ease;
    }

    .workspace.sidebar-open .sidebar-rail-actions{
      opacity:0;
      pointer-events:none;
    }

    .rail-action{
      width:34px;
      height:34px;
      padding:0;
      background:transparent;
      color:#505854;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:color .14s ease,transform .14s ease;
    }

    .rail-action:hover{
      color:var(--accent);
      transform:translateY(-1px);
    }

    .rail-action .icon{
      width:15px;
      height:15px;
    }

    .meta-rail-action{
      color:var(--accent);
    }

    .sidebar-content{
      width:100%;
      padding:4px 8px 12px;
      opacity:0;
      transform:translateX(-6px);
      pointer-events:none;
      transition:opacity .14s ease,transform .2s var(--ease);
    }

    .workspace.sidebar-open .sidebar-content{
      opacity:1;
      transform:none;
      pointer-events:auto;
      transition-delay:.06s;
    }

    .sidebar-label{
      padding:0 6px 8px;
      color:#4d514f;
      font-size:9px;
      font-weight:750;
      text-transform:uppercase;
      letter-spacing:.11em;
    }

    .project-list{
      display:flex;
      flex-direction:column;
      gap:2px;
    }

    .project-row{
      width:100%;
      height:38px;
      border-radius:9px;
      padding:0 6px;
      display:flex;
      align-items:center;
      gap:9px;
      background:transparent;
      color:#8a8d88;
      cursor:pointer;
      position:relative;
      transition:background .14s ease,color .14s ease;
    }

    .project-row:hover{
      background:#0d0d0c;
      color:#c8cbc6;
    }

    .project-row.active{
      background:#10100f;
      color:#f0f1ec;
    }

    .project-icon{
      width:19px;
      height:24px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
      color:var(--project-color);
    }

    .project-icon .icon{
      width:15px;
      height:15px;
      stroke-width:1.9;
    }

    .project-name{
      appearance:none;
      border:0;
      outline:0;
      background:transparent;
      color:inherit;
      padding:0;
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:12px;
      line-height:1;
      font-weight:650;
      flex:1 1 auto;
      text-align:left;
      cursor:pointer;
    }

    .project-edit{
      width:26px;
      height:26px;
      border-radius:7px;
      padding:0;
      background:transparent;
      color:#4e514e;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      opacity:0;
      transition:opacity .12s ease,color .12s ease,background .12s ease;
    }

    .project-row:hover .project-edit,
    .project-row.active .project-edit{
      opacity:1;
    }

    .project-edit:hover{
      color:var(--accent);
      background:#151513;
    }

    .project-edit .icon{width:14px;height:14px}

    .new-project{
      width:100%;
      height:38px;
      margin-top:7px;
      border-radius:9px;
      padding:0 7px;
      background:transparent;
      color:#555b58;
      display:flex;
      align-items:center;
      gap:9px;
      cursor:pointer;
      font-size:11.5px;
      font-weight:650;
      transition:background .14s ease,color .14s ease;
    }

    .new-project:hover{
      background:var(--accent-soft);
      color:var(--accent);
    }

    .new-project .icon{width:14px;height:14px}


    .meta-row{
      margin-bottom:10px;
    }

    .meta-row .project-name{
      font-weight:720;
      color:#dfe2dd;
    }

    .meta-row.active{
      background:#101211;
    }

    .meta-separator{
      height:1px;
      margin:2px 6px 12px;
      background:var(--line);
    }

    /* ---------- Main ---------- */

    .main{
      min-width:0;
      min-height:100vh;
    }

    .board-header{
      height:var(--header-h);
      padding:0 20px;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .current-project-icon{
      width:19px;
      height:27px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--project-color);
      flex:0 0 auto;
      cursor:pointer;
      transition:opacity .14s ease,transform .14s ease;
    }

    .current-project-icon:hover{
      opacity:.78;
      transform:translateY(-1px);
    }

    .current-project-icon .icon{
      width:16px;
      height:16px;
      stroke-width:1.9;
    }

    .current-title{
      margin:0;
      min-width:0;
      color:#eeeeea;
      font-size:15px;
      line-height:1;
      font-weight:730;
      letter-spacing:-.018em;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      cursor:pointer;
      transition:color .14s ease;
    }

    .current-title:hover{
      color:var(--accent);
    }

    .header-spacer{flex:1 1 auto}


    .board-shell{
      width:100%;
      min-height:calc(100vh - var(--header-h));
      display:grid;
      grid-template-columns:minmax(0,1fr) 44px;
      align-items:stretch;
      padding:0 0 22px 20px;
    }

    .board{
      width:100%;
      min-height:calc(100vh - var(--header-h) - 22px);
      display:grid;
      grid-template-columns:repeat(var(--columns,3),minmax(0,1fr));
      gap:0;
      overflow:visible;
      align-items:stretch;
    }

    .column{
      min-width:0;
      min-height:calc(100vh - var(--header-h) - 22px);
      padding:0 16px 18px;
      position:relative;
      align-self:stretch;
      display:flex;
      flex-direction:column;
    }

    .column:first-child{padding-left:0}
    .column:last-child{padding-right:16px}

    .column:not(:last-child)::after{
      content:"";
      position:absolute;
      top:0;
      right:0;
      bottom:0;
      width:1px;
      background:var(--line);
      pointer-events:none;
    }

    .column-head{
      min-height:48px;
      display:flex;
      align-items:center;
      gap:8px;
      padding:2px 0 11px;
      position:relative;
      z-index:2;
      min-width:0;
    }

    .drag-handle{
      width:16px;
      height:28px;
      padding:0;
      border-radius:0;
      background:transparent;
      color:#3d4445;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:grab;
      flex:0 0 auto;
      opacity:.6;
      transition:color .15s ease,opacity .15s ease,transform .15s ease;
      touch-action:none;
    }

    .drag-handle .icon{width:13px;height:13px}

    .drag-handle:hover{
      color:var(--accent);
      opacity:1;
    }

    .drag-handle:active{
      cursor:grabbing;
      transform:scale(.94);
    }

    .column-title-button{
      appearance:none;
      padding:0;
      margin:0;
      background:transparent;
      color:var(--ink);
      cursor:text;
      text-align:left;
      min-width:0;
      max-width:100%;
      font-size:13px;
      line-height:1.25;
      font-weight:700;
      letter-spacing:-.01em;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }



    .column-title-input{
      width:100%;
      min-width:0;
      height:30px;
      border:0;
      outline:0;
      border-radius:7px;
      padding:0 8px;
      background:#11110f;
      color:var(--ink);
      font-size:13px;
      font-weight:700;
    }

    .count{
      height:22px;
      min-width:22px;
      padding:0 6px;
      border-radius:999px;
      background:var(--accent-soft);
      color:#6db7c0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:10px;
      line-height:1;
      font-weight:700;
      flex:0 0 auto;
    }

    .count.semantic-backlog{
      background:#151514;
      color:#777772;
    }

    .count.semantic-progress{
      background:#0d3439;
      color:#67d7e2;
    }

    .count.semantic-done{
      background:#102519;
      color:#63c985;
    }




    .column-spacer{flex:1 1 auto;min-width:3px}

    .add-task{
      width:30px;
      height:30px;
      padding:0;
      border-radius:8px;
      background:transparent;
      color:#6f6f6a;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:background .15s ease,color .15s ease,transform .15s ease;
      flex:0 0 auto;
    }

    .add-task:hover{
      background:var(--accent-soft);
      color:var(--accent);
    }

    .add-task:active{transform:scale(.96)}

    .archive-filter{
      display:flex;
      align-items:center;
      gap:6px;
      flex:0 0 auto;
    }

    .archive-filter-label{
      color:#5e6464;
      font-size:9.5px;
      font-weight:650;
      white-space:nowrap;
    }

    .switch{
      width:28px;
      height:16px;
      border-radius:999px;
      background:#1b1b19;
      position:relative;
      cursor:pointer;
      padding:0;
      flex:0 0 auto;
      transition:background .16s ease;
    }

    .switch::after{
      content:"";
      position:absolute;
      width:10px;
      height:10px;
      border-radius:50%;
      left:3px;
      top:3px;
      background:#666661;
      transition:transform .18s var(--ease),background .18s ease;
    }

    .switch.on{background:#0d3439}

    .switch.on::after{
      transform:translateX(12px);
      background:var(--accent);
    }

    .task-list{
      min-height:100px;
      flex:1 1 auto;
      display:flex;
      flex-direction:column;
      gap:9px;
      position:relative;
      padding-bottom:18px;
    }

    .task{
      position:relative;
      border-radius:var(--radius);
      padding:13px 13px 11px 16px;
      min-width:0;
      height:148px;
      cursor:grab;
      display:flex;
      flex-direction:column;
      user-select:none;
      background:var(--task-bg);
      overflow:hidden;
      box-shadow:0 1px 0 rgba(255,255,255,.018) inset;
      transition:background .18s ease,opacity .16s ease,transform .18s var(--ease);
      will-change:transform;
    }

    .task.priority-low{--priority:var(--low);--task-bg:var(--low-bg)}
    .task.priority-medium{--priority:var(--medium);--task-bg:var(--medium-bg)}
    .task.priority-high{--priority:var(--high);--task-bg:var(--high-bg)}

    .task::before{
      content:"";
      position:absolute;
      left:0;
      top:0;
      bottom:0;
      width:3px;
      background:var(--priority);
    }

    .task:hover{
      background:color-mix(in srgb,var(--task-bg) 79%,white 21%);
    }

    .task.dragging{
      opacity:.24;
      transform:scale(.985);
    }

    .task.archived{
      opacity:.45;
      cursor:default;
    }

    .task.archived:hover{
      opacity:.58;
      transform:none;
    }

    .task-title{
      margin:0;
      color:#f1f1ee;
      font-size:13.5px;
      line-height:1.42;
      font-weight:700;
      letter-spacing:-.01em;
      overflow-wrap:anywhere;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .task-description{
      margin:7px 0 0;
      color:#8b8b85;
      font-size:12px;
      line-height:1.45;
      height:52.2px;
      min-height:52.2px;
      max-height:52.2px;
      display:-webkit-box;
      -webkit-line-clamp:3;
      -webkit-box-orient:vertical;
      overflow:hidden;
      overflow-wrap:anywhere;
    }

    .task-description.empty-description{visibility:hidden}

    .task-meta{
      margin-top:auto;
      padding-top:10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      color:#666660;
      font-size:10.5px;
      line-height:1;
      min-width:0;
      overflow:visible;
    }

    .task-meta .icon{width:12px;height:12px}

    .status-age{
      display:inline-flex;
      align-items:center;
      gap:5px;
      white-space:nowrap;
      overflow:visible;
      min-width:max-content;
    }

    .archive-task,
    .unarchive-task{
      height:24px;
      padding:0 8px;
      border-radius:7px;
      background:transparent;
      color:#72746f;
      display:inline-flex;
      align-items:center;
      gap:5px;
      cursor:pointer;
      font-size:10px;
      font-weight:650;
      transition:
        background .14s ease,
        color .14s ease,
        transform .14s ease;
    }

    .archive-task:hover{
      background:#0d1516;
      color:#a6dce2;
    }

    .unarchive-task{
      color:#74877b;
    }

    .unarchive-task:hover{
      background:#0e1712;
      color:#8ed2a4;
    }

    .archive-task:active,
    .unarchive-task:active{
      transform:scale(.97);
    }

    .archive-task .icon,
    .unarchive-task .icon{
      width:12px;
      height:12px;
    }

    .empty{
      min-height:92px;
      flex:1 1 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#3e3e3a;
      font-size:11.5px;
      text-align:center;
      pointer-events:none;
    }

    .column-placeholder{opacity:.2}

    .edge-add{
      width:44px;
      min-height:100%;
      background:transparent;
      color:#4f5f61;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      padding:0 0 0 8px;
      cursor:pointer;
      transition:background .15s ease,color .15s ease;
      border-left:1px solid var(--line);
      touch-action:none;
    }

    .edge-add:hover{
      background:var(--accent-soft);
      color:var(--accent);
    }

    .edge-add.trash-mode{
      color:#75434b;
      background:#10090b;
      cursor:default;
    }

    .edge-add.trash-mode.can-delete{color:#d85c70}

    .edge-add.trash-mode.can-delete.trash-hover{
      color:#ff667e;
      background:#210c11;
    }

    .edge-add.trash-mode.blocked{opacity:.55}
    .edge-add .icon{width:15px;height:15px}

    .touch-drag-ghost,
    .column-drag-ghost{
      position:fixed;
      z-index:120;
      pointer-events:none;
      margin:0;
      opacity:.92;
      transform:rotate(.5deg) scale(1.015);
      box-shadow:0 18px 50px rgba(0,0,0,.42);
    }

    .touch-drag-ghost{border-radius:var(--radius)}

    .column-drag-ghost{
      background:#080808;
      border-radius:10px;
      padding:0 16px 16px;
      overflow:hidden;
    }


    .board-shell.meta-mode{
      grid-template-columns:minmax(0,1fr);
    }

    .board-shell.meta-mode .edge-add{
      display:none;
    }

    .meta-project-card{
      position:relative;
      min-height:166px;
      border-radius:12px;
      padding:13px 13px 12px 15px;
      background:#0b0b0a;
      overflow:hidden;
      cursor:pointer;
      user-select:none;
      transition:background .16s ease,transform .18s var(--ease);
    }

    .meta-project-card::before{
      content:"";
      position:absolute;
      left:0;
      top:0;
      bottom:0;
      width:2px;
      background:var(--project-color);
      opacity:.82;
    }

    .meta-project-card:hover{
      transform:translateY(-1px);
      background:#10100f;
    }


    .meta-card-head{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
      margin-bottom:11px;
    }

    .meta-card-icon{
      width:17px;
      height:20px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--project-color);
      flex:0 0 auto;
    }

    .meta-card-icon .icon{
      width:14px;
      height:14px;
    }

    .meta-card-title{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      color:#eeeeea;
      font-size:12.5px;
      font-weight:700;
      flex:1 1 auto;
    }


    .mini-board{
      height:103px;
      display:grid;
      grid-template-columns:repeat(var(--mini-cols,3),minmax(0,1fr));
      background:#070707;
      overflow:hidden;
    }

    .mini-column{
      min-width:0;
      padding:8px 6px 6px;
      display:flex;
      flex-direction:column;
      gap:4px;
      position:relative;
    }

    .mini-column:not(:last-child)::after{
      content:"";
      position:absolute;
      top:0;
      right:0;
      bottom:0;
      width:1px;
      background:#171715;
    }

    .mini-column-head{
      width:max-content;
      max-width:100%;
      min-width:18px;
      height:12px;
      padding:0 4px;
      border-radius:999px;
      background:#171715;
      color:#646460;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:5.5px;
      line-height:1;
      font-weight:800;
      letter-spacing:.01em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      margin-bottom:2px;
    }

    .mini-column-head.semantic-backlog{
      background:#171715;
      color:#85857f;
    }

    .mini-column-head.semantic-progress{
      background:#0d3439;
      color:#67d7e2;
    }

    .mini-column-head.semantic-done{
      background:#102519;
      color:#63c985;
    }

    .mini-column-head.semantic-custom{
      background:var(--accent-soft);
      color:#6db7c0;
    }

    .mini-task{
      height:9px;
      min-height:9px;
      border-radius:2px;
      background:var(--mini-priority);
      opacity:.72;
    }

    .mini-task.priority-low{--mini-priority:var(--low)}
    .mini-task.priority-medium{--mini-priority:var(--medium)}
    .mini-task.priority-high{--mini-priority:var(--high)}

    .mini-more{
      color:#484843;
      font-size:7px;
      line-height:1;
      margin-top:1px;
    }

    .meta-empty-copy{
      color:#454541;
      font-size:10px;
      text-align:center;
      margin:auto 0;
    }

    /* ---------- Dialogs ---------- */

    .modal-backdrop{
      position:fixed;
      inset:0;
      z-index:80;
      background:rgba(0,0,0,.72);
      backdrop-filter:blur(7px);
      -webkit-backdrop-filter:blur(7px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      opacity:0;
      pointer-events:none;
      transition:opacity .17s ease;
    }

    .modal-backdrop.open{
      opacity:1;
      pointer-events:auto;
    }

    .modal{
      width:min(560px,100%);
      background:#0d0d0c;
      border-radius:16px;
      padding:20px;
      box-shadow:0 28px 85px rgba(0,0,0,.55);
      transform:translateY(8px) scale(.995);
      transition:transform .18s var(--ease);
    }

    .modal.compact{width:min(430px,100%)}

    .modal-backdrop.open .modal{transform:none}

    .modal-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      margin-bottom:18px;
    }

    .modal-kicker{
      color:#69bdc7;
      font-size:10px;
      line-height:1.2;
      font-weight:750;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .modal-title{
      margin:4px 0 0;
      color:#f3f3ef;
      font-size:20px;
      line-height:1.25;
      font-weight:750;
      letter-spacing:-.025em;
    }

    .close{
      width:32px;
      height:32px;
      background:#121210;
      color:#72726c;
      border-radius:8px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .close:hover{
      background:#181816;
      color:#cfcfc8;
    }

    .field{margin-top:13px}

    .field label{
      display:block;
      margin:0 0 7px 1px;
      color:#787872;
      font-size:10.5px;
      font-weight:700;
    }

    .input,.textarea{
      width:100%;
      border:0;
      outline:0;
      color:#efefeb;
      background:#141412;
      border-radius:10px;
      padding:12px 13px;
      transition:background .15s ease;
    }

    .input::placeholder,.textarea::placeholder{color:#4e4e49}
    .input:focus,.textarea:focus{background:#171715}

    .textarea{
      min-height:125px;
      resize:vertical;
      line-height:1.5;
    }

    .priority-picker{position:relative}

    .priority-trigger{
      width:100%;
      height:44px;
      border-radius:10px;
      padding:0 12px;
      background:#141412;
      color:#e9e9e4;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      cursor:pointer;
    }

    .priority-trigger:hover{
      background:#171715;
      box-shadow:inset 0 0 0 1px #173136;
    }

    .priority-trigger-main{
      display:flex;
      align-items:center;
      gap:9px;
      min-width:0;
    }

    .priority-swatch{
      width:9px;
      height:9px;
      border-radius:999px;
      background:var(--priority-color);
      flex:0 0 auto;
    }

    .priority-trigger-text{
      font-size:13px;
      font-weight:650;
    }

    .priority-menu{
      position:absolute;
      left:0;
      right:0;
      top:calc(100% + 7px);
      z-index:10;
      background:#151513;
      border-radius:11px;
      padding:5px;
      box-shadow:0 18px 50px rgba(0,0,0,.42);
      opacity:0;
      transform:translateY(-5px) scale(.99);
      transform-origin:top;
      pointer-events:none;
      transition:opacity .14s ease,transform .14s ease;
    }

    .priority-picker.open .priority-menu{
      opacity:1;
      transform:none;
      pointer-events:auto;
    }

    .priority-option{
      width:100%;
      min-height:40px;
      border-radius:8px;
      background:transparent;
      color:#d7d7d0;
      padding:0 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      cursor:pointer;
    }

    .priority-option:hover{background:#1d1d1a}

    .priority-option-left{
      display:flex;
      align-items:center;
      gap:9px;
    }

    .priority-option-check{
      color:#7f7f78;
      opacity:0;
    }

    .priority-option.selected .priority-option-check{opacity:1}

    .project-customizer{
      display:grid;
      grid-template-columns:1fr;
      gap:16px;
      margin-top:14px;
    }

    .choice-section label{
      display:block;
      margin:0 0 8px 1px;
      color:#787872;
      font-size:10.5px;
      font-weight:700;
    }



    .color-grid{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .color-choice{
      width:27px;
      height:27px;
      border-radius:8px;
      padding:0;
      background:var(--swatch);
      cursor:pointer;
      position:relative;
      transition:transform .14s ease;
    }

    .color-choice:hover{transform:scale(1.08)}

    .color-choice.selected::after{
      content:"";
      position:absolute;
      inset:5px;
      border-radius:4px;
      box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.68);
    }

    .icon-grid{
      display:grid;
      grid-template-columns:repeat(10,1fr);
      gap:10px 7px;
      align-items:center;
    }

    .icon-choice{
      position:relative;
      height:28px;
      padding:0;
      background:transparent;
      color:#666b68;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:color .14s ease,transform .14s ease,opacity .14s ease;
    }

    .icon-choice:hover{
      color:#d1d3ce;
      transform:translateY(-1px);
    }

    .icon-choice.selected{
      color:var(--selected-icon-color,var(--accent));
      transform:scale(1.08);
    }

    .icon-choice.selected::after{
      content:"";
      position:absolute;
      left:50%;
      bottom:-2px;
      width:3px;
      height:3px;
      border-radius:50%;
      background:currentColor;
      transform:translateX(-50%);
    }

    .icon-choice .icon{
      width:16px;
      height:16px;
    }

    .modal-actions{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-top:20px;
    }

    .action-group{
      display:flex;
      align-items:center;
      gap:8px;
      margin-left:auto;
    }

    .btn{
      border:0;
      border-radius:9px;
      padding:10px 14px;
      cursor:pointer;
      font-size:12.5px;
      font-weight:700;
      transition:background .15s ease,color .15s ease,transform .15s ease;
    }

    .btn:active{transform:scale(.98)}

    .btn-primary{
      background:var(--accent);
      color:#041012;
    }

    .btn-primary:hover{background:#2fd2e2}

    .btn-ghost{
      background:#141412;
      color:#777771;
    }

    .btn-ghost:hover{
      background:#191917;
      color:#bcbcb5;
    }

    .btn-danger{
      background:transparent;
      color:#8c4e54;
      padding-inline:6px;
    }

    .btn-danger:hover{color:#c76a73}

    .toast{
      position:fixed;
      left:50%;
      bottom:20px;
      z-index:160;
      transform:translate(-50%,10px);
      background:#171715;
      color:#d9d9d3;
      padding:9px 12px;
      border-radius:9px;
      box-shadow:0 12px 34px rgba(0,0,0,.35);
      opacity:0;
      pointer-events:none;
      font-size:11.5px;
      transition:opacity .16s ease,transform .16s ease;
    }

    .toast.show{
      opacity:1;
      transform:translate(-50%,0);
    }

    .mobile-scrim{
      display:none;
    }

    @media(max-width:1120px){
      .archive-filter-label{display:none}
    }

    @media(max-width:760px){
      body{overflow-x:auto}

      .workspace,
      .workspace.sidebar-open{
        grid-template-columns:var(--sidebar-collapsed) minmax(0,1fr);
      }

      .sidebar{
        position:sticky;
        left:0;
        top:0;
        height:100vh;
        z-index:40;
      }

      .workspace.sidebar-open .sidebar{
        position:fixed;
        width:var(--sidebar-open);
        left:0;
        top:0;
        bottom:0;
        box-shadow:18px 0 50px rgba(0,0,0,.42);
      }

      .workspace.sidebar-open .mobile-scrim{
        display:block;
        position:fixed;
        inset:0;
        z-index:35;
        background:rgba(0,0,0,.45);
      }

      .main{
        min-width:max-content;
      }

      .board-header{
        width:calc(100vw - var(--sidebar-collapsed));
        padding:0 12px;
        position:sticky;
        left:var(--sidebar-collapsed);
      }

      .board-shell{
        width:max-content;
        min-width:calc(100vw - var(--sidebar-collapsed));
        grid-template-columns:max-content 44px;
        padding:0 0 18px 12px;
      }

      .board{
        width:max-content;
        min-width:calc(100vw - var(--sidebar-collapsed) - 46px);
        min-height:calc(100vh - var(--header-h) - 18px);
        grid-template-columns:none !important;
        grid-auto-flow:column;
        grid-auto-columns:minmax(280px,82vw);
      }

      .column{
        min-width:280px;
        width:82vw;
        min-height:calc(100vh - var(--header-h) - 18px);
        padding:0 14px 18px;
      }

      .column:first-child{padding-left:0}
      .task-list{min-height:calc(100vh - var(--header-h) - 82px)}

      .edge-add{
        position:sticky;
        right:0;
        min-height:calc(100vh - var(--header-h) - 18px);
        background:var(--bg);
        z-index:6;
      }

      .drag-handle{
        width:18px;
        opacity:.72;
      }

      .icon-grid{grid-template-columns:repeat(8,1fr)}
    }
  </style>
</head>
<body>
  <div class="workspace" id="workspace">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <div class="sidebar-top">
          <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Open projects"></button>
        </div>

        <div class="sidebar-rail-actions" id="sidebarRailActions">
          <button class="rail-action meta-rail-action" id="metaRailButton" type="button" aria-label="Abrir Metakanban"></button>
          <button class="rail-action" id="newRailProject" type="button" aria-label="Crear nuevo kanban"></button>
        </div>

        <div class="sidebar-content">
          <div class="project-row meta-row" id="metaProjectRow" style="--project-color:var(--accent)">
            <div class="project-icon" id="metaSidebarIcon"></div>
            <button class="project-name" id="metaProjectButton" type="button">Metakanban</button>
          </div>
          <div class="meta-separator"></div>

          <div class="sidebar-label">Proyectos</div>
          <div class="project-list" id="projectList"></div>

          <button class="new-project" id="newProject" type="button"></button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="board-header">
        <div class="current-project-icon" id="currentProjectIcon"></div>
        <h1 class="current-title" id="currentTitle"></h1>
        <div class="header-spacer"></div>
      </header>

      <section class="board-shell" id="boardShell" aria-label="Kanban board">
        <div class="board" id="board"></div>
        <button class="edge-add" id="edgeAction" type="button" aria-label="Add column"></button>
      </section>
    </main>

    <div class="mobile-scrim" id="mobileScrim"></div>
  </div>

  <!-- Task dialog -->
  <div class="modal-backdrop" id="taskModalBackdrop" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle">
      <div class="modal-head">
        <div>
          <div class="modal-kicker" id="taskModalKicker">Nueva tarea</div>
          <h2 class="modal-title" id="taskModalTitle">Add task</h2>
        </div>
        <button class="close" id="closeTaskModal" type="button" aria-label="Close"></button>
      </div>

      <form id="taskForm">
        <div class="field">
          <label for="taskTitle">Título</label>
          <input class="input" id="taskTitle" maxlength="100" placeholder="¿Qué hay que hacer?" required />
        </div>

        <div class="field">
          <label for="taskDescription">Descripción</label>
          <textarea class="textarea" id="taskDescription" maxlength="900" placeholder="Añade contexto"></textarea>
        </div>

        <div class="field">
          <label>Prioridad</label>
          <div class="priority-picker" id="priorityPicker">
            <button class="priority-trigger" id="priorityTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span class="priority-trigger-main">
                <span class="priority-swatch" id="prioritySwatch"></span>
                <span class="priority-trigger-text" id="priorityText">Media</span>
              </span>
              <span id="priorityChevron"></span>
            </button>

            <div class="priority-menu" role="listbox" aria-label="Priority">
              <button class="priority-option" type="button" data-priority="low" role="option">
                <span class="priority-option-left"><span class="priority-swatch" style="--priority-color:var(--low)"></span><span>Baja</span></span>
                <span class="priority-option-check"></span>
              </button>
              <button class="priority-option" type="button" data-priority="medium" role="option">
                <span class="priority-option-left"><span class="priority-swatch" style="--priority-color:var(--medium)"></span><span>Media</span></span>
                <span class="priority-option-check"></span>
              </button>
              <button class="priority-option" type="button" data-priority="high" role="option">
                <span class="priority-option-left"><span class="priority-swatch" style="--priority-color:var(--high)"></span><span>Alta</span></span>
                <span class="priority-option-check"></span>
              </button>
            </div>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-danger" id="deleteTask" hidden>Eliminar</button>
          <div class="action-group">
            <button type="button" class="btn btn-ghost" id="cancelTaskModal">Cancelar</button>
            <button type="submit" class="btn btn-primary" id="saveTask">Crear tarea</button>
          </div>
        </div>
      </form>
    </section>
  </div>

  <!-- Project dialog -->
  <div class="modal-backdrop" id="projectModalBackdrop" aria-hidden="true">
    <section class="modal compact" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle">
      <div class="modal-head">
        <div>
          <div class="modal-kicker" id="projectModalKicker">Proyecto</div>
          <h2 class="modal-title" id="projectModalTitle">Edit project</h2>
        </div>
        <button class="close" id="closeProjectModal" type="button" aria-label="Close"></button>
      </div>

      <form id="projectForm">
        <div class="field">
          <label for="projectName">Nombre</label>
          <input class="input" id="projectName" maxlength="40" placeholder="Nombre del proyecto" required />
        </div>

        <div class="project-customizer">
          <div class="choice-section">
            <label>Color</label>
            <div class="color-grid" id="colorGrid"></div>
          </div>

          <div class="choice-section">
            <label>Icono</label>
            <div class="icon-grid" id="iconGrid"></div>
          </div>
        </div>

        <div class="modal-actions">
          <div></div>
          <div class="action-group">
            <button type="button" class="btn btn-ghost" id="cancelProjectModal">Cancelar</button>
            <button type="submit" class="btn btn-primary" id="saveProject">Save</button>
          </div>
        </div>
      </form>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>

        b.columns = Array.isArray(b.columns) ? b.columns : [];
        b.tasks = Array.isArray(b.tasks) ? b.tasks : [];

        b.columns.forEach(c => {
          c.isDone = Boolean(c.isDone);
          c.isProgress = Boolean(c.isProgress);
          c.isBacklog = Boolean(c.isBacklog);
        });

        if(!b.columns.some(c => c.isProgress)){
          const inferred =
            b.columns.find(c => c.title.trim().toLowerCase() === "progress") ||
            b.columns.find((c,index) => index === 1 && !c.isDone);
          if(inferred) inferred.isProgress = true;
        }

        if(!b.columns.some(c => c.isBacklog)){
          const inferredBacklog =
            b.columns.find(c => c.title.trim().toLowerCase() === "backlog") ||
            b.columns.find(c => !c.isDone && !c.isProgress);
          if(inferredBacklog) inferredBacklog.isBacklog = true;
        }

        b.tasks.forEach(t => {
          t.enteredAt = Number(t.enteredAt || Date.now());
          t.archived = Boolean(t.archived);
        });
      });
    }

    function renderAll(){
      boardState = getActiveBoard();
      autoArchiveAllBoards();
      renderSidebar();
      renderHeader();

      if(appState.activeBoardId === META_ID){
        renderMetaBoard();
      }else{
        renderBoard();
      }
    }

      projectList.innerHTML = "";
      metaProjectRow.classList.toggle("active",appState.activeBoardId === META_ID);

      appState.boards.forEach(project => {

        icon.className = "project-icon";

    function renderHeader(){
      if(appState.activeBoardId === META_ID){
        currentTitle.textContent = "Metakanban";
        currentProjectIcon.style.setProperty("--project-color","var(--accent)");
        currentProjectIcon.innerHTML = icons.network;

      }

      if(!boardState) return;

    }

    function switchProject(id){
      if(id === appState.activeBoardId) return;
      appState.activeBoardId = id;
      boardState = getActiveBoard();
      showArchived = false;
      persistWorkspace();
      renderAll();

      if(window.innerWidth <= 760){
        setSidebar(false);
      }
    }

    metaProjectButton.addEventListener("click",() => switchProject(META_ID));
    metaProjectRow.addEventListener("click",event => {
      if(event.target.closest("button") && event.target !== metaProjectButton) return;

    function setSidebar(open){
      sidebarOpen = open;
      workspace.classList.toggle("sidebar-open",sidebarOpen);

      const toggle = document.getElementById("sidebarToggle");

      toggle.setAttribute("aria-label",sidebarOpen ? "Close projects" : "Open projects");

    document.getElementById("sidebarToggle").addEventListener("click",() => setSidebar(!sidebarOpen));
