    document.getElementById("metaRailButton").addEventListener("click",() => switchProject(META_ID));
    document.getElementById("newRailProject").addEventListener("click",openNewProject);
    currentProjectIcon.addEventListener("click",() => {
      if(boardState) openProjectEditor(boardState.id);
    });
    currentTitle.addEventListener("click",() => {
      if(boardState) openProjectEditor(boardState.id);
    });

    function autoArchiveAllBoards(){
      const cutoff = Date.now() - ARCHIVE_AFTER_MS;
      let changed = false;

      appState.boards.forEach(project => {
        const doneIds = new Set(project.columns.filter(c => c.isDone).map(c => c.id));

        project.tasks.forEach(task => {
          if(!task.archived && doneIds.has(task.columnId) && task.enteredAt <= cutoff){
            task.archived = true;
            task.archivedAt = Date.now();
            changed = true;
          }
        });
      });

      if(changed) persistWorkspace();
    }


    function getProjectRollupStatus(project){
      const progressIds = new Set(
        project.columns.filter(column => column.isProgress).map(column => column.id)
      );
      const doneIds = new Set(
        project.columns.filter(column => column.isDone).map(column => column.id)
      );

      const activeTasks = project.tasks.filter(task => !task.archived);

      if(activeTasks.some(task => progressIds.has(task.columnId))){
        return "progress";
      }

      if(
        project.tasks.length > 0 &&
        project.tasks.every(task => task.archived || doneIds.has(task.columnId))
      ){
        return "done";
      }

      return "backlog";
    }


    function renderMetaBoard(){
      boardShell.classList.add("meta-mode");
      board.style.setProperty("--columns",3);
      board.innerHTML = "";

      const metaColumns = [
        {id:"meta-backlog",title:"Backlog",status:"backlog"},
        {id:"meta-progress",title:"Progress",status:"progress"},
        {id:"meta-done",title:"Done",status:"done"}
      ];

      metaColumns.forEach(metaColumn => {
        const projects = appState.boards.filter(project => getProjectRollupStatus(project) === metaColumn.status);
        const visibleCount = projects.length;

        const columnEl = document.createElement("section");
        columnEl.className = "column";

        const head = document.createElement("div");
        head.className = "column-head";

        const title = document.createElement("div");
        title.className = "column-title-button";
        title.style.cursor = "default";
        title.textContent = metaColumn.title;

        const count = document.createElement("span");
        count.className = `count semantic-${metaColumn.status}`;
        count.textContent = visibleCount;

        head.append(title,count);

        const list = document.createElement("div");
        list.className = "task-list";

        projects.forEach(project => {
          list.appendChild(createMetaProjectCard(project,metaColumn.status));
        });

        columnEl.append(head,list);
        board.appendChild(columnEl);
      });
    }


    function createMetaProjectCard(project,status){
      const card = document.createElement("article");
      card.className = "meta-project-card";
      card.style.setProperty("--project-color",project.color);
      card.setAttribute("role","button");
      card.setAttribute("tabindex","0");
      card.setAttribute("aria-label",`Open ${project.name}`);

      const head = document.createElement("div");
      head.className = "meta-card-head";

      const icon = document.createElement("div");
      icon.className = "meta-card-icon";
      icon.innerHTML = icons[project.icon] || icons.folder;

      const title = document.createElement("div");
      title.className = "meta-card-title";
      title.textContent = project.name;

      head.append(icon,title);

      const mini = document.createElement("div");
      mini.className = "mini-board";
      mini.style.setProperty("--mini-cols",Math.max(project.columns.length,1));

      project.columns.forEach(column => {
        const miniColumn = document.createElement("div");
        miniColumn.className = "mini-column";

        const miniHead = document.createElement("div");
        const semanticClass = getColumnSemanticClass(column);
        miniHead.className = `mini-column-head ${semanticClass}`;
        miniHead.textContent = column.title;
        miniHead.title = column.title;
        miniColumn.appendChild(miniHead);

        const tasks = project.tasks.filter(task => task.columnId === column.id && !task.archived);
        const shown = tasks.slice(0,5);

        shown.forEach(task => {
          const block = document.createElement("div");
          block.className = `mini-task priority-${task.priority}`;
          block.title = task.title;
          miniColumn.appendChild(block);
        });

        if(tasks.length > shown.length){
          const more = document.createElement("div");
          more.className = "mini-more";
          more.textContent = `+${tasks.length-shown.length}`;
          miniColumn.appendChild(more);
        }

        mini.appendChild(miniColumn);
      });

      if(project.columns.length === 0){
        const empty = document.createElement("div");
        empty.className = "meta-empty-copy";
        empty.textContent = "Empty board";
        mini.appendChild(empty);
      }

      card.append(head,mini);

      const open = () => switchProject(project.id);
      card.addEventListener("click",open);
      card.addEventListener("keydown",event => {
        if(event.key === "Enter" || event.key === " "){
          event.preventDefault();
          open();
        }
      });

      return card;
    }

    function renderBoard(){
      boardShell.classList.remove("meta-mode");
      board.style.setProperty("--columns",Math.max(boardState.columns.length,1));
      board.innerHTML = "";

      boardState.columns.forEach(column => board.appendChild(createColumn(column)));
      updateAges();
    }


    function getColumnSemanticClass(column){
      if(column?.isDone) return "semantic-done";
      if(column?.isProgress) return "semantic-progress";
      if(column?.isBacklog) return "semantic-backlog";
      return "semantic-custom";
    }

    function createColumn(column){
      const columnEl = document.createElement("section");
      columnEl.className = "column";
      columnEl.dataset.columnId = column.id;

      const activeTasks = boardState.tasks.filter(task => task.columnId === column.id && !task.archived);
      let visibleTasks = activeTasks;

      if(column.isDone && showArchived){
        visibleTasks = boardState.tasks.filter(task => task.columnId === column.id);
      }

      const head = document.createElement("div");
      head.className = "column-head";

      const handle = document.createElement("button");
      handle.className = "drag-handle";
      handle.type = "button";
      handle.draggable = true;
      handle.setAttribute("aria-label",`Move ${column.title}`);
      handle.innerHTML = icons.grip;

      const titleButton = document.createElement("button");
      titleButton.type = "button";
      titleButton.className = "column-title-button";
      titleButton.textContent = column.title;
      titleButton.title = "Click to rename";
      titleButton.addEventListener("click",() => beginRenameColumn(column.id,titleButton));

      const count = document.createElement("span");
      count.className = `count ${getColumnSemanticClass(column)}`;
      count.textContent = activeTasks.length;

      const spacer = document.createElement("div");
      spacer.className = "column-spacer";

      head.append(handle,titleButton,count,spacer);

      if(column.isDone){
        const archiveFilter = document.createElement("div");
        archiveFilter.className = "archive-filter";

        const label = document.createElement("span");
        label.className = "archive-filter-label";
        label.textContent = "Archived";

        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = `switch${showArchived ? " on" : ""}`;
        toggle.setAttribute("aria-label","Show archived tasks");
        toggle.setAttribute("aria-pressed",showArchived ? "true" : "false");
        toggle.addEventListener("click",event => {
          event.stopPropagation();
          showArchived = !showArchived;
          renderBoard();
        });

        archiveFilter.append(label,toggle);
        head.appendChild(archiveFilter);
      }

      const add = document.createElement("button");
      add.type = "button";
      add.className = "add-task";
      add.setAttribute("aria-label",`Add task to ${column.title}`);
      add.innerHTML = icons.plus;
      add.addEventListener("click",() => openCreateTask(column.id));
      head.appendChild(add);

      const list = document.createElement("div");
      list.className = "task-list";
      list.dataset.columnId = column.id;

      if(visibleTasks.length === 0){
        list.appendChild(createEmpty());
      }else{
        visibleTasks.forEach(task => list.appendChild(createTaskCard(task,column)));
      }

      setupColumnDrag(columnEl,handle);
      setupTaskDropZone(list);

      columnEl.append(head,list);
      return columnEl;
    }

    function createEmpty(){
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Suelta una tarea aquí";
      return empty;
    }

    function createTaskCard(task,column){
      const card = document.createElement("article");
      card.className = `task priority-${task.priority}${task.archived ? " archived" : ""}`;
      card.dataset.taskId = task.id;
      card.draggable = !task.archived;

      const title = document.createElement("h3");
      title.className = "task-title";
      title.textContent = task.title;
      card.appendChild(title);

      const description = document.createElement("p");
      description.className = "task-description";
      if(task.description?.trim()){
        description.textContent = task.description;
      }else{
        description.textContent = "Placeholder";
        description.classList.add("empty-description");
      }
      card.appendChild(description);

      const meta = document.createElement("div");
      meta.className = "task-meta";

      const age = document.createElement("span");
      age.className = "status-age";
      age.dataset.enteredAt = task.enteredAt;
      age.innerHTML = `${icons.clock}<span class="age-text"></span>`;
      meta.appendChild(age);

      if(column.isDone && !task.archived){
        const archive = document.createElement("button");
        archive.type = "button";
        archive.className = "archive-task";
        archive.innerHTML = `${icons.archive}<span>Archivar</span>`;
        archive.addEventListener("pointerdown",event => event.stopPropagation());
        archive.addEventListener("mousedown",event => event.stopPropagation());
        archive.addEventListener("click",event => {
          event.stopPropagation();
          task.archived = true;
          task.archivedAt = Date.now();
          persistWorkspace();
          renderBoard();
          showToast("Tarea archivada");
        });
        meta.appendChild(archive);
      }

      if(column.isDone && task.archived){
        const unarchive = document.createElement("button");
        unarchive.type = "button";
        unarchive.className = "unarchive-task";
        unarchive.innerHTML = `${icons.unarchive}<span>Desarchivar</span>`;
        unarchive.addEventListener("pointerdown",event => event.stopPropagation());
        unarchive.addEventListener("mousedown",event => event.stopPropagation());
        unarchive.addEventListener("click",event => {
          event.stopPropagation();
          task.archived = false;
          task.archivedAt = null;
          task.enteredAt = Date.now();
          persistWorkspace();
          renderBoard();
          showToast("Tarea restaurada");
        });
        meta.appendChild(unarchive);
      }

      card.appendChild(meta);

      if(!task.archived){
        card.addEventListener("dragstart",event => {
          if(draggingColumnId){
            event.preventDefault();
            return;
          }

          draggingTaskId = task.id;
          draggingTaskEl = card;
          originalTaskColumnId = task.columnId;
          taskDropCommitted = false;
          suppressTaskClick = true;

          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain",`task:${task.id}`);
          requestAnimationFrame(() => card.classList.add("dragging"));
        });

        card.addEventListener("dragend",() => {
          if(!taskDropCommitted) renderBoard();
          clearTaskDrag();
          setTimeout(() => suppressTaskClick = false,80);
        });

        setupTouchTaskDrag(card,task);
      }

      card.addEventListener("click",() => {
        if(!suppressTaskClick) openEditTask(task.id);
      });

      return card;
    }

    function setupTaskDropZone(list){
      list.addEventListener("dragover",event => {
        if(!draggingTaskEl || draggingColumnId) return;
        event.preventDefault();

        const empty = list.querySelector(".empty");
        if(empty) empty.remove();

        const firstRects = snapshotTaskRects();
        const after = getDragAfterElement(list,event.clientY);

        if(after == null){
          if(list.lastElementChild !== draggingTaskEl){
            list.appendChild(draggingTaskEl);
            animateTaskLayout(firstRects);
          }
        }else if(after !== draggingTaskEl && draggingTaskEl.nextElementSibling !== after){
          list.insertBefore(draggingTaskEl,after);
          animateTaskLayout(firstRects);
        }

        updateVisibleCounts();
      });

      list.addEventListener("drop",event => {
        if(!draggingTaskId || !draggingTaskEl || draggingColumnId) return;
        event.preventDefault();
        taskDropCommitted = true;

        const task = boardState.tasks.find(item => item.id === draggingTaskId);
        const newColumnId = list.dataset.columnId;

        if(task && task.columnId !== newColumnId){
          task.columnId = newColumnId;
          task.enteredAt = Date.now();
          task.archived = false;
          task.archivedAt = null;
        }

        syncTasksFromDom();
        persistWorkspace();
        clearTaskDrag();
        renderBoard();
      });
    }

    function getDragAfterElement(container,y){
      const cards = [...container.querySelectorAll(".task:not(.dragging):not(.archived)")];

      return cards.reduce((closest,child) => {
        const rect = child.getBoundingClientRect();
        const offset = y - rect.top - rect.height/2;
        if(offset < 0 && offset > closest.offset) return {offset,element:child};
        return closest;
      },{offset:Number.NEGATIVE_INFINITY,element:null}).element;
    }

    function snapshotTaskRects(){
      const map = new Map();
      document.querySelectorAll(".task:not(.dragging)").forEach(el => map.set(el.dataset.taskId,el.getBoundingClientRect()));
      return map;
    }

    function animateTaskLayout(firstRects){
      document.querySelectorAll(".task:not(.dragging)").forEach(el => {
        const first = firstRects.get(el.dataset.taskId);
        if(!first) return;

        const last = el.getBoundingClientRect();
        const dx = first.left-last.left;
        const dy = first.top-last.top;
        if(Math.abs(dx)<1 && Math.abs(dy)<1) return;

        el.animate(
          [{transform:`translate(${dx}px,${dy}px)`},{transform:"translate(0,0)"}],
          {duration:180,easing:"cubic-bezier(.22,.72,.22,1)"}
        );
      });
    }

    function setupColumnDrag(columnEl,handle){
      handle.addEventListener("dragstart",event => {
        draggingColumnId = columnEl.dataset.columnId;
        draggingColumnEl = columnEl;
        columnDropCommitted = false;
        draggedColumnCanDelete = columnTaskCount(draggingColumnId) === 0;
        setEdgeTrashMode(draggedColumnCanDelete);

        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain",`column:${draggingColumnId}`);

        const rect = columnEl.getBoundingClientRect();
        const ghost = columnEl.cloneNode(true);
        ghost.classList.add("column-drag-ghost");
        ghost.style.width = `${rect.width}px`;
        ghost.style.height = `${Math.min(rect.height,window.innerHeight*.78)}px`;
        ghost.style.left = "-9999px";
        ghost.style.top = "-9999px";
        document.body.appendChild(ghost);

        try{
          event.dataTransfer.setDragImage(ghost,Math.max(18,Math.min(event.clientX-rect.left,rect.width-18)),24);
        }catch(e){}

        setTimeout(() => ghost.remove(),0);
        requestAnimationFrame(() => columnEl.classList.add("column-placeholder"));
      });

      handle.addEventListener("dragend",() => {
        if(!columnDropCommitted) renderBoard();
        clearColumnDrag();
        setEdgeAddMode();
      });

      setupTouchColumnDrag(columnEl,handle);
    }

    board.addEventListener("dragover",event => {
      if(!draggingColumnEl) return;
      event.preventDefault();

      const candidates = [...board.querySelectorAll(".column:not(.column-placeholder)")];
      if(candidates.length === 0) return;

      const firstRects = snapshotColumnRects();
      let target = null;

      for(const candidate of candidates){
        const rect = candidate.getBoundingClientRect();
        if(event.clientX < rect.left + rect.width/2){
          target = candidate;
          break;
        }
      }

      if(target){
        if(draggingColumnEl.nextElementSibling !== target){
          board.insertBefore(draggingColumnEl,target);
          animateColumnLayout(firstRects);
        }
      }else if(board.lastElementChild !== draggingColumnEl){
        board.appendChild(draggingColumnEl);
        animateColumnLayout(firstRects);
      }
    });

    board.addEventListener("drop",event => {
      if(!draggingColumnEl) return;
      event.preventDefault();
      columnDropCommitted = true;
      syncColumnsFromDom();
      persistWorkspace();
      clearColumnDrag();
      setEdgeAddMode();
      renderBoard();
    });

    function snapshotColumnRects(){
      const map = new Map();
      board.querySelectorAll(".column:not(.column-placeholder)").forEach(el => map.set(el.dataset.columnId,el.getBoundingClientRect()));
      return map;
    }

    function animateColumnLayout(firstRects){
      board.querySelectorAll(".column:not(.column-placeholder)").forEach(el => {
        const first = firstRects.get(el.dataset.columnId);
        if(!first) return;
        const last = el.getBoundingClientRect();
        const dx = first.left-last.left;
        const dy = first.top-last.top;
        if(Math.abs(dx)<1 && Math.abs(dy)<1) return;

        el.animate(
          [{transform:`translate(${dx}px,${dy}px)`},{transform:"translate(0,0)"}],
          {duration:210,easing:"cubic-bezier(.22,.72,.22,1)"}
        );
      });
    }

    function setEdgeAddMode(){
      edgeAction.className = "edge-add";
      edgeAction.innerHTML = icons.plus;
      edgeAction.setAttribute("aria-label","Add column");
      edgeAction.title = "Add column";
    }

    function setEdgeTrashMode(canDelete){
      edgeAction.className = `edge-add trash-mode ${canDelete ? "can-delete" : "blocked"}`;
      edgeAction.innerHTML = icons.trash;
      edgeAction.setAttribute("aria-label",canDelete ? "Delete column" : "Column must be empty before deleting");
      edgeAction.title = canDelete ? "Drop here to delete column" : "Column must be empty before deleting";
    }

    edgeAction.addEventListener("click",() => {
      if(draggingColumnId) return;
      addColumn();
    });

    edgeAction.addEventListener("dragover",event => {
      if(!draggingColumnEl) return;
      event.preventDefault();
      if(draggedColumnCanDelete) edgeAction.classList.add("trash-hover");
    });

    edgeAction.addEventListener("dragleave",() => edgeAction.classList.remove("trash-hover"));

    edgeAction.addEventListener("drop",event => {
      if(!draggingColumnEl) return;
      event.preventDefault();
      event.stopPropagation();
      columnDropCommitted = true;

      if(!draggedColumnCanDelete){
        showToast("Solo se pueden eliminar columnas vacías");
        clearColumnDrag();
        setEdgeAddMode();
        renderBoard();
        return;
      }

      const id = draggingColumnId;
      boardState.columns = boardState.columns.filter(col => col.id !== id);
      persistWorkspace();
      showToast("Columna eliminada");
      clearColumnDrag();
      setEdgeAddMode();
      renderBoard();
    });

    function columnTaskCount(columnId){
      return boardState.tasks.filter(task => task.columnId === columnId).length;
    }

    function syncTasksFromDom(){
      const byId = new Map(boardState.tasks.map(task => [task.id,task]));
      const ordered = [];

      boardState.columns.forEach(column => {
        const list = board.querySelector(`.task-list[data-column-id="${cssEscape(column.id)}"]`);
        if(!list) return;

        list.querySelectorAll(".task").forEach(card => {
          const task = byId.get(card.dataset.taskId);
          if(task && !task.archived){
            task.columnId = column.id;
            ordered.push(task);
            byId.delete(task.id);
          }
        });

        boardState.tasks
          .filter(task => task.columnId === column.id && task.archived && byId.has(task.id))
          .forEach(task => {
            ordered.push(task);
            byId.delete(task.id);
          });
      });

      byId.forEach(task => ordered.push(task));
      boardState.tasks = ordered;
    }

    function syncColumnsFromDom(){
      const byId = new Map(boardState.columns.map(column => [column.id,column]));
      const ordered = [];

      board.querySelectorAll(".column").forEach(el => {
        const column = byId.get(el.dataset.columnId);
        if(column){
          ordered.push(column);
          byId.delete(column.id);
        }
      });

      byId.forEach(column => ordered.push(column));
      boardState.columns = ordered;
    }

    function clearTaskDrag(){
      if(draggingTaskEl) draggingTaskEl.classList.remove("dragging");
      draggingTaskId = null;
      draggingTaskEl = null;
      originalTaskColumnId = null;
      taskDropCommitted = false;
    }

    function clearColumnDrag(){
      if(draggingColumnEl) draggingColumnEl.classList.remove("column-placeholder");
      draggingColumnId = null;
      draggingColumnEl = null;
      columnDropCommitted = false;
      draggedColumnCanDelete = false;
      edgeAction.classList.remove("trash-hover");
    }

    function updateVisibleCounts(){
      board.querySelectorAll(".column").forEach(column => {
        const count = column.querySelector(".count");
        const list = column.querySelector(".task-list");
        if(count && list) count.textContent = list.querySelectorAll(".task:not(.archived)").length;
      });
    }

    function beginRenameColumn(columnId,button){
      const column = boardState.columns.find(item => item.id === columnId);
      if(!column) return;

      const input = document.createElement("input");
      input.className = "column-title-input";
      input.value = column.title;
      input.maxLength = 34;
      button.replaceWith(input);
      input.focus();
      input.select();

      let finished = false;

      const finish = save => {
        if(finished) return;
        finished = true;
        const next = input.value.trim();
        if(save && next){
          column.title = next;
          persistWorkspace();
        }
        renderBoard();
      };

      input.addEventListener("keydown",event => {
        if(event.key === "Enter"){event.preventDefault();finish(true)}
        if(event.key === "Escape"){event.preventDefault();finish(false)}
      });

      input.addEventListener("blur",() => finish(true));
    }

    function addColumn(){
      const column = {
        id:crypto.randomUUID(),
        title:"New column",
        isDone:false,
        isProgress:false,
        isBacklog:false
      };

      boardState.columns.push(column);
      persistWorkspace();
      renderBoard();

      requestAnimationFrame(() => {
        const el = board.querySelector(`.column[data-column-id="${cssEscape(column.id)}"]`);
        const titleButton = el?.querySelector(".column-title-button");
        if(titleButton) beginRenameColumn(column.id,titleButton);
      });
    }

    /* ---------- Task dialog ---------- */

    function openCreateTask(columnId){
      const column = boardState.columns.find(item => item.id === columnId);
      if(!column) return;

      editingTaskId = null;
      creatingColumnId = columnId;
      taskModalKicker.textContent = "Nueva tarea";
      taskModalTitle.textContent = `Add to ${column.title}`;
      saveTask.textContent = "Crear tarea";
      deleteTask.hidden = true;

      taskForm.reset();
      selectedPriority = "medium";
      updatePriorityPicker();
      openModal(taskModalBackdrop);

      requestAnimationFrame(() => taskTitle.focus());
    }

    function openEditTask(taskId){
      const task = boardState.tasks.find(item => item.id === taskId);
      if(!task) return;

      editingTaskId = taskId;
      creatingColumnId = null;
      taskModalKicker.textContent = task.archived ? "Archived task" : "Detalles de tarea";
      taskModalTitle.textContent = "Edit task";
      saveTask.textContent = "Guardar cambios";
      deleteTask.hidden = false;

      taskTitle.value = task.title;
      taskDescription.value = task.description || "";
      selectedPriority = task.priority;
      updatePriorityPicker();
      openModal(taskModalBackdrop);
    }

    function setPriority(priority){
      selectedPriority = priority;
      updatePriorityPicker();
      priorityPicker.classList.remove("open");
      priorityTrigger.setAttribute("aria-expanded","false");
    }

    function updatePriorityPicker(){
      const labels = {low:"Low",medium:"Medium",high:"High"};
      const colors = {low:"var(--low)",medium:"var(--medium)",high:"var(--high)"};

      priorityText.textContent = labels[selectedPriority];
      prioritySwatch.style.setProperty("--priority-color",colors[selectedPriority]);

      document.querySelectorAll(".priority-option").forEach(option => {
        const selected = option.dataset.priority === selectedPriority;
        option.classList.toggle("selected",selected);
        option.setAttribute("aria-selected",selected ? "true" : "false");
      });
    }

    priorityTrigger.addEventListener("click",() => {
      const open = !priorityPicker.classList.contains("open");
      priorityPicker.classList.toggle("open",open);
      priorityTrigger.setAttribute("aria-expanded",open ? "true" : "false");
    });

    document.querySelectorAll(".priority-option").forEach(option => {
      option.addEventListener("click",() => setPriority(option.dataset.priority));
    });

    document.addEventListener("mousedown",event => {
      if(!priorityPicker.contains(event.target)){
        priorityPicker.classList.remove("open");
        priorityTrigger.setAttribute("aria-expanded","false");
      }
    });

    taskForm.addEventListener("submit",event => {
      event.preventDefault();

      const title = taskTitle.value.trim();
      const description = taskDescription.value.trim();
      if(!title) return;

      if(editingTaskId){
        const task = boardState.tasks.find(item => item.id === editingTaskId);
        if(task){
          task.title = title;
          task.description = description;
          task.priority = selectedPriority;
        }
      }else{
        const columnId = creatingColumnId || boardState.columns[0]?.id;
        boardState.tasks.push({
          id:crypto.randomUUID(),
          columnId,
          title,
          description,
          priority:selectedPriority,
          enteredAt:Date.now(),
          archived:false,
          archivedAt:null
        });
      }

      persistWorkspace();
      renderBoard();
      closeModal(taskModalBackdrop);
    });

    deleteTask.addEventListener("click",() => {
      if(!editingTaskId) return;
      boardState.tasks = boardState.tasks.filter(task => task.id !== editingTaskId);
      persistWorkspace();
      renderBoard();
      closeModal(taskModalBackdrop);
      showToast("Tarea eliminada");
    });

    /* ---------- Project dialog ---------- */

    function buildProjectPicker(){
      colorGrid.innerHTML = "";
      PROJECT_COLORS.forEach(color => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `color-choice${color === selectedProjectColor ? " selected" : ""}`;
        button.style.setProperty("--swatch",color);
        button.setAttribute("aria-label",`Use ${color}`);
        button.addEventListener("click",() => {
          selectedProjectColor = color;
          buildProjectPicker();
        });
        colorGrid.appendChild(button);
      });

      iconGrid.innerHTML = "";
      PROJECT_ICONS.forEach(name => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `icon-choice${name === selectedProjectIcon ? " selected" : ""}`;
        button.style.setProperty("--selected-icon-color",selectedProjectColor);
        button.innerHTML = icons[name];
        button.setAttribute("aria-label",`Use ${name} icon`);
        button.addEventListener("click",() => {
          selectedProjectIcon = name;
          buildProjectPicker();
        });
        iconGrid.appendChild(button);
      });
    }


    function openNewProject(){
      projectModalMode = "new";
      editingProjectId = null;
      selectedProjectIcon = "folder";
      selectedProjectColor = PROJECT_COLORS[0];
      projectName.value = "";
      projectModalKicker.textContent = "Nuevo kanban";
      projectModalTitle.textContent = "Crear proyecto";
      document.getElementById("saveProject").textContent = "Create";
      buildProjectPicker();
      openModal(projectModalBackdrop);
      requestAnimationFrame(() => projectName.focus());
    }

    function openProjectEditor(projectId){
      const project = appState.boards.find(item => item.id === projectId);
      if(!project) return;

      projectModalMode = "edit";
      editingProjectId = projectId;
      selectedProjectIcon = project.icon;
      selectedProjectColor = project.color;
      projectName.value = project.name;
      projectModalKicker.textContent = "Project";
      projectModalTitle.textContent = "Apariencia del proyecto";
      document.getElementById("saveProject").textContent = "Save";
      buildProjectPicker();
      openModal(projectModalBackdrop);
    }

    projectForm.addEventListener("submit",event => {
      event.preventDefault();
      const name = projectName.value.trim();
      if(!name) return;

      if(projectModalMode === "new"){
        const id = crypto.randomUUID();
        const project = makeBoard(id,name,selectedProjectIcon,selectedProjectColor,[]);
        appState.boards.push(project);
        appState.activeBoardId = id;
        boardState = project;
        showArchived = false;
        persistWorkspace();
        renderAll();
        closeModal(projectModalBackdrop);
        showToast("Kanban creado");
      }else{
        const project = appState.boards.find(item => item.id === editingProjectId);
        if(project){
          project.name = name;
          project.icon = selectedProjectIcon;
          project.color = selectedProjectColor;
          persistWorkspace();
          renderAll();
        }
        closeModal(projectModalBackdrop);
      }
    });

    /* ---------- Shared dialogs ---------- */

    function openModal(backdrop){
      backdrop.classList.add("open");
      backdrop.setAttribute("aria-hidden","false");
      document.body.style.overflow = "hidden";
    }

    function closeModal(backdrop){
      backdrop.classList.remove("open");
      backdrop.setAttribute("aria-hidden","true");

      if(!document.querySelector(".modal-backdrop.open")){
        document.body.style.overflow = "";
      }

      if(backdrop === taskModalBackdrop){
        priorityPicker.classList.remove("open");
        priorityTrigger.setAttribute("aria-expanded","false");
        editingTaskId = null;
        creatingColumnId = null;
      }
    }

    document.getElementById("closeTaskModal").addEventListener("click",() => closeModal(taskModalBackdrop));
    document.getElementById("cancelTaskModal").addEventListener("click",() => closeModal(taskModalBackdrop));
    document.getElementById("closeProjectModal").addEventListener("click",() => closeModal(projectModalBackdrop));
    document.getElementById("cancelProjectModal").addEventListener("click",() => closeModal(projectModalBackdrop));

    taskModalBackdrop.addEventListener("mousedown",event => {
      if(event.target === taskModalBackdrop) closeModal(taskModalBackdrop);
    });

    projectModalBackdrop.addEventListener("mousedown",event => {
      if(event.target === projectModalBackdrop) closeModal(projectModalBackdrop);
    });

    document.addEventListener("keydown",event => {
      if(event.key !== "Escape") return;
      if(projectModalBackdrop.classList.contains("open")) closeModal(projectModalBackdrop);
      else if(taskModalBackdrop.classList.contains("open")) closeModal(taskModalBackdrop);
      else if(sidebarOpen && window.innerWidth <= 760) setSidebar(false);
    });

    /* ---------- Time ---------- */

    function updateAges(){
      document.querySelectorAll(".status-age").forEach(el => {
        const text = el.querySelector(".age-text");
        if(text) text.textContent = formatElapsed(Date.now()-Number(el.dataset.enteredAt));
      });
    }

    function formatElapsed(ms){
      const seconds = Math.max(0,Math.floor(ms/1000));
      if(seconds < 60) return `${seconds}s`;
      const minutes = Math.floor(seconds/60);
      if(minutes < 60) return `${minutes}m`;
      const hours = Math.floor(minutes/60);
      if(hours < 24) return `${hours}h`;
      return `${Math.floor(hours/24)}d`;
    }

    /* ---------- Touch task drag ---------- */

    function setupTouchTaskDrag(card,task){
      let timer = null;
      let pointerId = null;
      let startX = 0;
      let startY = 0;
      let active = false;

      card.addEventListener("pointerdown",event => {
        if(event.pointerType === "mouse" || touchTaskDrag || touchColumnDrag) return;
        pointerId = event.pointerId;
        startX = event.clientX;
        startY = event.clientY;

        timer = setTimeout(() => {
          active = true;
          suppressTaskClick = true;
          startTouchTaskDrag(card,task,event.clientX,event.clientY,pointerId);
        },180);
      });

      card.addEventListener("pointermove",event => {
        if(event.pointerId !== pointerId) return;

        if(!active){
          if(Math.hypot(event.clientX-startX,event.clientY-startY)>9){
            clearTimeout(timer);
            timer = null;
          }
          return;
        }

        event.preventDefault();
        moveTouchTaskDrag(event.clientX,event.clientY);
      });

      const finish = event => {
        if(event.pointerId !== pointerId) return;
        clearTimeout(timer);
        timer = null;

        if(active){
          event.preventDefault();
          finishTouchTaskDrag();
          active = false;
          setTimeout(() => suppressTaskClick = false,120);
        }

        pointerId = null;
      };

      card.addEventListener("pointerup",finish);
      card.addEventListener("pointercancel",finish);
    }

    function startTouchTaskDrag(card,task,x,y,pointerId){
      const rect = card.getBoundingClientRect();
      const ghost = card.cloneNode(true);
      ghost.querySelector(".archive-task")?.remove();
      ghost.classList.remove("dragging");
      ghost.classList.add("touch-drag-ghost");
      ghost.style.width = `${rect.width}px`;
      ghost.style.left = `${rect.left}px`;
      ghost.style.top = `${rect.top}px`;
      document.body.appendChild(ghost);

      draggingTaskId = task.id;
      draggingTaskEl = card;
      originalTaskColumnId = task.columnId;

      touchTaskDrag = {pointerId,ghost,offsetX:x-rect.left,offsetY:y-rect.top};
      card.classList.add("dragging");

      if(card.setPointerCapture){
        try{card.setPointerCapture(pointerId)}catch(e){}
      }

      moveTouchTaskDrag(x,y);
    }

    function moveTouchTaskDrag(x,y){
      if(!touchTaskDrag || !draggingTaskEl) return;

      const {ghost,offsetX,offsetY} = touchTaskDrag;
      ghost.style.left = `${x-offsetX}px`;
      ghost.style.top = `${y-offsetY}px`;

      const under = document.elementFromPoint(x,y);
      const list = under?.closest?.(".task-list");
      if(!list) return;

      const empty = list.querySelector(".empty");
      if(empty) empty.remove();

      const firstRects = snapshotTaskRects();
      const after = getDragAfterElement(list,y);

      if(after == null){
        if(list.lastElementChild !== draggingTaskEl){
          list.appendChild(draggingTaskEl);
          animateTaskLayout(firstRects);
        }
      }else if(after !== draggingTaskEl && draggingTaskEl.nextElementSibling !== after){
        list.insertBefore(draggingTaskEl,after);
        animateTaskLayout(firstRects);
      }

      updateVisibleCounts();

      if(x < 44) window.scrollBy({left:-14,behavior:"auto"});
      else if(x > window.innerWidth-44) window.scrollBy({left:14,behavior:"auto"});
    }

    function finishTouchTaskDrag(){
      if(!touchTaskDrag || !draggingTaskId || !draggingTaskEl) return;

      const list = draggingTaskEl.closest(".task-list");
      const newColumnId = list?.dataset.columnId;
      const task = boardState.tasks.find(item => item.id === draggingTaskId);

      if(task && newColumnId){
        if(task.columnId !== newColumnId){
          task.columnId = newColumnId;
          task.enteredAt = Date.now();
          task.archived = false;
          task.archivedAt = null;
        }
        syncTasksFromDom();
        persistWorkspace();
      }

      touchTaskDrag.ghost.remove();
      touchTaskDrag = null;
      clearTaskDrag();
      renderBoard();
    }

    /* ---------- Touch column drag ---------- */

    function setupTouchColumnDrag(columnEl,handle){
      let pointerId = null;
      let active = false;

      handle.addEventListener("pointerdown",event => {
        if(event.pointerType === "mouse" || touchTaskDrag || touchColumnDrag) return;
        event.preventDefault();
        pointerId = event.pointerId;
        active = true;
        startTouchColumnDrag(columnEl,event.clientX,event.clientY,pointerId);

        if(handle.setPointerCapture){
          try{handle.setPointerCapture(pointerId)}catch(e){}
        }
      });

      handle.addEventListener("pointermove",event => {
        if(!active || event.pointerId !== pointerId) return;
        event.preventDefault();
        moveTouchColumnDrag(event.clientX,event.clientY);
      });

      const finish = event => {
        if(!active || event.pointerId !== pointerId) return;
        event.preventDefault();
        finishTouchColumnDrag(event.clientX,event.clientY);
        active = false;
        pointerId = null;
      };

      handle.addEventListener("pointerup",finish);
      handle.addEventListener("pointercancel",finish);
    }

    function startTouchColumnDrag(columnEl,x,y,pointerId){
      const rect = columnEl.getBoundingClientRect();
      const ghost = columnEl.cloneNode(true);
      ghost.classList.add("column-drag-ghost");
      ghost.style.width = `${rect.width}px`;
      ghost.style.height = `${Math.min(rect.height,window.innerHeight*.72)}px`;
      ghost.style.left = `${rect.left}px`;
      ghost.style.top = `${Math.max(8,Math.min(rect.top,window.innerHeight-80))}px`;
      document.body.appendChild(ghost);

      draggingColumnId = columnEl.dataset.columnId;
      draggingColumnEl = columnEl;
      draggedColumnCanDelete = columnTaskCount(draggingColumnId) === 0;
      setEdgeTrashMode(draggedColumnCanDelete);
      columnEl.classList.add("column-placeholder");

      touchColumnDrag = {pointerId,ghost,offsetX:x-rect.left};
    }

    function moveTouchColumnDrag(x,y){
      if(!touchColumnDrag || !draggingColumnEl) return;

      const ghostRect = touchColumnDrag.ghost.getBoundingClientRect();
      touchColumnDrag.ghost.style.left = `${x-touchColumnDrag.offsetX}px`;
      touchColumnDrag.ghost.style.top = `${Math.max(8,Math.min(y-24,window.innerHeight-ghostRect.height-8))}px`;

      const trashRect = edgeAction.getBoundingClientRect();
      const overTrash = x>=trashRect.left && x<=trashRect.right && y>=trashRect.top && y<=trashRect.bottom;
      edgeAction.classList.toggle("trash-hover",overTrash && draggedColumnCanDelete);

      if(overTrash) return;

      const candidates = [...board.querySelectorAll(".column:not(.column-placeholder)")];
      if(candidates.length === 0) return;

      const firstRects = snapshotColumnRects();
      let target = null;

      for(const candidate of candidates){
        const rect = candidate.getBoundingClientRect();
        if(x < rect.left+rect.width/2){
          target = candidate;
          break;
        }
      }

      if(target){
        if(draggingColumnEl.nextElementSibling !== target){
          board.insertBefore(draggingColumnEl,target);
          animateColumnLayout(firstRects);
        }
      }else if(board.lastElementChild !== draggingColumnEl){
        board.appendChild(draggingColumnEl);
        animateColumnLayout(firstRects);
      }

      if(x < 44) window.scrollBy({left:-14,behavior:"auto"});
      else if(x > window.innerWidth-44) window.scrollBy({left:14,behavior:"auto"});
    }

    function finishTouchColumnDrag(x,y){
      if(!touchColumnDrag || !draggingColumnEl) return;

      const rect = edgeAction.getBoundingClientRect();
      const overTrash = x>=rect.left && x<=rect.right && y>=rect.top && y<=rect.bottom;

      if(overTrash){
        if(draggedColumnCanDelete){
          const id = draggingColumnId;
          boardState.columns = boardState.columns.filter(col => col.id !== id);
          persistWorkspace();
          showToast("Columna eliminada");
        }else{
          showToast("Solo se pueden eliminar columnas vacías");
        }
      }else{
        syncColumnsFromDom();
        persistWorkspace();
      }

      touchColumnDrag.ghost.remove();
      touchColumnDrag = null;
      clearColumnDrag();
      setEdgeAddMode();
      renderBoard();
    }

    function showToast(message){
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"),1400);
    }

    function cssEscape(value){
      if(window.CSS && CSS.escape) return CSS.escape(value);
      return String(value).replace(/["\\]/g,"\\$&");
    }

    normalizeWorkspace();
    renderAll();
    buildProjectPicker();
    updatePriorityPicker();
    setSidebar(false);

    setInterval(updateAges,1000);
    setInterval(() => {
      autoArchiveAllBoards();
      if(appState.activeBoardId === META_ID) renderMetaBoard();
      else renderBoard();
    },60*1000);
  </script>
</body>
</html>
