user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    log_format main '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream bruma_upstream {
        server bruma:3000;
        keepalive 16;
    }

    upstream pulso_upstream {
        server pulso:8000;
        keepalive 16;
    }

    upstream norte_upstream {
        server norte:80;
        keepalive 16;
    }

    upstream opotest_upstream {
        server opotest:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        client_max_body_size 10m;

        if ($http_x_forwarded_proto = http) {
            return 308 https://$host$request_uri;
        }

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok\n';
        }

        location = / {
            try_files /index.html =404;
        }

        # BRUMA: Next.js conoce su basePath /bruma, por eso NO se elimina el prefijo.
        location = /bruma {
            return 308 /bruma/;
        }
        location /bruma/ {
            proxy_pass http://bruma_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cookie_path / /bruma/;
            proxy_read_timeout 60s;
        }

        # PULSO: el código interno conserva rutas /..., mientras el navegador usa /pulso/....
        # La barra final de proxy_pass elimina /pulso/ antes de llegar a FastAPI.
        location = /pulso {
            return 308 /pulso/;
        }
        location /pulso/ {
            proxy_pass http://pulso_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /pulso;
            proxy_cookie_path / /pulso/;
            proxy_read_timeout 60s;
        }

        # NORTE: el navegador conserva /norte/, pero el contenedor sirve desde /.
        location = /norte {
            absolute_redirect off;
            return 308 /norte/;
        }
        location /norte/ {
            proxy_pass http://norte_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /norte;
            proxy_read_timeout 60s;
        }

        # OPOTEST: la aplicacion genera URLs bajo /opotest y el gateway elimina
        # el prefijo antes de reenviar la peticion al contenedor FastAPI.
        location = /opotest {
            return 308 /opotest/;
        }
        location /opotest/ {
            proxy_pass http://opotest_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /opotest;
            proxy_read_timeout 60s;
        }

        location ~ ^/(?!bruma(?:/|$)|pulso(?:/|$)|norte(?:/|$)|opotest(?:/|$)|healthz$) {
            return 404;
        }
    }
}
